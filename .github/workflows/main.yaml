name: Despliegue automatico a Surge.sh

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Surge globalmente
        run: npm install -g surge

      - name: Desplegar sitio web en Surge
        run: surge ./ nandomolina26-parcial1.surge.sh --token ${{ secrets.SURGE_TOKEN }}
